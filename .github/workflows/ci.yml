name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/list-changed-paths.sh | node scripts/ci/classify-changed-paths.mjs
      - name: Check migration safety
        run: node scripts/check-migrations.mjs

  web_static:
    name: web_static
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:static

  vitest_workers:
    name: vitest_workers (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --no-file-parallelism --exclude test/global-search-prototype.test.ts --exclude test/prototype-local-seed.test.ts --shard=${{ matrix.shard }}

  browser:
    name: browser (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run desktop browser coverage
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}
          else
            pnpm exec playwright test --project=chromium --grep @pr-smoke --shard=${{ matrix.shard }}
          fi
      - run: pnpm exec playwright test --project=mobile-chromium --grep @mobile-smoke --shard=${{ matrix.shard }}

  check:
    name: check
    needs: [changes, web_static, vitest_workers, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate required check
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          web_required="${{ needs.changes.outputs.web }}"
          web_static="${{ needs.web_static.result }}"
          vitest_workers="${{ needs.vitest_workers.result }}"
          browser="${{ needs.browser.result }}"
          echo "changes=$changes web_required=$web_required web_static=$web_static vitest_workers=$vitest_workers browser=$browser"
          if [[ "$changes" != "success" ]]; then
            exit 1
          fi
          if [[ "$web_required" == "true" ]]; then
            expected="success"
          elif [[ "$web_required" == "false" ]]; then
            expected="skipped"
          else
            exit 1
          fi
          for result in "$web_static" "$vitest_workers" "$browser"; do
            if [[ "$result" != "$expected" ]]; then
              exit 1
            fi
          done
